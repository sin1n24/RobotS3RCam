; ============================================================
; STEP2 — ペアリング + MAC履歴管理 + P2P制御通信 + 映像伝送
; ============================================================

[common]
platform  = espressif32@6.7.0
framework = arduino
monitor_speed = 115200
monitor_dtr   = 1
monitor_rts   = 1
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    hpsaturn/EspNowCam @ ^0.2.1

; M5Avatar を使う ctrlr 系で追加する依存
[common_ctrlr]
lib_deps =
    ${common.lib_deps}
    meganetaaan/m5stack-avatar @ ^0.9.0

; ------------------------------------------------------------
; AtomS3R-CAM : 映像送信 + サーボ駆動 + ENQ/PING応答
; ------------------------------------------------------------
[env:AtomS3R-Cam]
extends     = common
board       = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DROLE_ROBOT

; ------------------------------------------------------------
; AtomS3R : LCD + ADC制御 / ロボット動作 (Aダブルクリックで切替)
;   Mode R_CON / L_CON : コントローラ (映像受信 + 制御送信)
;   Mode ROBOT         : サーボ駆動 + M5Avatar表示
; ------------------------------------------------------------
[env:AtomS3R]
extends     = common
board       = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DROLE_CTRLR
lib_deps    = ${common_ctrlr.lib_deps}

; ------------------------------------------------------------
; AtomS3 : 同上 (PSRAM なし)
; ------------------------------------------------------------
[env:AtomS3]
extends     = common
board       = m5stack-atoms3
build_flags =
    ${common.build_flags}
    -DROLE_CTRLR
lib_deps    = ${common_ctrlr.lib_deps}

; ------------------------------------------------------------
; AtomS3R-CAM : ロボット / コントローラ 兼用
;   起動時に OK ボタン (G38) を押しながら電源ON → Controller (R_CON)
;   それ以外                                   → Robot (サーボ駆動 + 映像送信)
; ------------------------------------------------------------
[env:AtomS3R-Cam-Combo]
extends     = common
board       = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DROLE_CTRLR
    -DHAS_CAMERA
    -DCAM_COMBO
lib_deps    = ${common_ctrlr.lib_deps}

; ------------------------------------------------------------
; AtomS3R-CAM : コントローラ (映像送信 + 制御送信)
;   Mode R_CON : 右手持ちコントローラ (Aダブルクリックで L_CON と切替)
;   Mode L_CON : 左手持ちコントローラ
;   → ペアリング相手は AtomS3R/AtomS3 の MODE_ROBOT_DISP
; ------------------------------------------------------------
[env:AtomS3R-Cam-Ctrlr]
extends     = common
board       = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DROLE_CTRLR
    -DHAS_CAMERA
lib_deps    = ${common_ctrlr.lib_deps}
