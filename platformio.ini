; ============================================================
; STEP2 — ペアリング + MAC履歴管理 + P2P制御通信 + 映像伝送
; ============================================================

[common]
platform  = espressif32@6.7.0
framework = arduino
monitor_speed = 115200
monitor_dtr   = 1
monitor_rts   = 1
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    hpsaturn/EspNowCam @ ^0.2.1

; ------------------------------------------------------------
; AtomS3R-CAM : 映像送信 + サーボ駆動 + ENQ/PING応答
; ------------------------------------------------------------
[env:atoms3r-robot]
extends     = common
board       = esp32-s3-devkitc-1
build_flags =
    ${common.build_flags}
    -DROLE_ROBOT

; ------------------------------------------------------------
; AtomS3R : LCD表示 + 可変抵抗 + P2P制御パケット送信 + ペアリング
; ------------------------------------------------------------
[env:atoms3r-ctrlr]
extends     = common
board       = esp32-s3-devkitc-1
build_flags =
    ${common.build_flags}
    -DROLE_CTRLR